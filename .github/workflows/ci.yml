name: CI

# Deterministic, org-independent checks: linting, formatting, and LWC unit
# tests. Apex unit tests require a live Salesforce org (SetupAuditTrail rows
# cannot be inserted outside one) and are intentionally NOT run here — see
# CONTRIBUTING.md for how to run them locally/in an org-connected pipeline.
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint-format-test:
        name: Lint, format check, and Jest tests
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Lint LWC/Aura JavaScript
              run: npm run lint

            - name: Verify formatting
              run: npm run prettier:verify

            - name: Run LWC Jest tests
              run: npm run test:unit:coverage
